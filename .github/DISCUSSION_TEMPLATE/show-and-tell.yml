title: "[Show and tell] "
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "@operatornest/convex-razorpay"
        - "@operatornest/convex-zoho-cpaas"
        - "@operatornest/convex-models-dev"
        - "@operatornest/convex-web-push"
        - Multiple components
    validations:
      required: true
  - type: input
    id: project-demo-link
    attributes:
      label: Project or demo link
      description: Share a public link if you have one.
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: what-built
    attributes:
      label: What you built
      description: Explain how you used the component and what someone can try.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Share useful implementation details, lessons, or limitations.
    validations:
      required: false
